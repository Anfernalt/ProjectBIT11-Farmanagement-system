services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-dairy-local}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dairy_farm}
    ports:
      - "3306:3306"
    volumes:
      - dairy_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dairy_mysql_data: